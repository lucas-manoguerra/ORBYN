name: Borrador de release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release-drafter-main
  cancel-in-progress: true

jobs:
  actualizar-borrador:
    name: actualizar-borrador
    runs-on: ubuntu-latest
    steps:
      - name: Actualizar notas de versión
        uses: release-drafter/release-drafter@978bb0b30c5ee8cdd332ced253758157150d43f0 # v7.10.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
