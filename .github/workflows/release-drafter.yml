name: Borrador de release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release-drafter-main
  cancel-in-progress: true

jobs:
  actualizar-borrador:
    name: actualizar-borrador
    runs-on: ubuntu-latest
    steps:
      - name: Actualizar notas de versión
        uses: release-drafter/release-drafter@d1a19e60e81a7e650d00a7de9277f87e439117ea # v7.11.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
