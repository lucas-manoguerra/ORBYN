name: Análisis estático de seguridad

on:
  push:
    branches: [developer, test, release, main, production]
  pull_request:
    branches: [developer, test, release, main, production]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analizar:
    name: analizar-rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: rust
      - uses: github/codeql-action/analyze@v3
