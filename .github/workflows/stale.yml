name: Mantenimiento de issues y PR

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: mantenimiento-inactividad
  cancel-in-progress: true

jobs:
  marcar-inactivos:
    name: marcar-inactivos
    runs-on: ubuntu-latest
    steps:
      - name: Identificar issues y PR inactivos
        uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          days-before-stale: 90
          days-before-close: -1
          stale-issue-label: Stale
          stale-pr-label: Stale
          stale-issue-message: ""
          stale-pr-message: ""
          exempt-issue-labels: security, pinned, roadmap
          exempt-pr-labels: security, pinned, roadmap
          remove-stale-when-updated: true
