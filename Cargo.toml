[workspace]
resolver = "2"
members = ["crates/platform-core"]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "UNLICENSED"
repository = "https://github.com/lucas-manoguerra/ORBYN"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
